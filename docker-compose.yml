services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: planning-advisor-api
    ports:
      - "${API_PORT:-8000}:8000"
    # Put SUPABASE_* / GEMINI_* in the project-root .env (same folder as this file).
    # Do not set those keys to empty strings under `environment:` — that overrides env_file.
    env_file:
      - .env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      MULTI_HOP: ${MULTI_HOP:-true}
      HYBRID_SEARCH: ${HYBRID_SEARCH:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/chat}
        NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-PlantagenetPlanningAdvisor/0.1 (docker)}
    container_name: planning-advisor-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-PlantagenetPlanningAdvisor/0.1 (docker)}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
